# 每一行一台服务器，格式如下：
# 名称|用户|主机/IP|端口|私钥路径|密码
#
# 用户常见值：
# Ubuntu 一般是 ubuntu
# Oracle Linux 一般是 opc
# Debian 一般是 debian
#
# 私钥路径如果暂时不知道，就先写 -
# 密码如果不想保存，就留空
# 配置密码后会自动输入密码；交互 SSH 用 OpenSSH askpass，命令执行用 expect
# 执行 copy-key 成功后会移除密码并改用密钥

oc1|root|YOUR_SERVER_IP_1|22|-|
oc2|root|YOUR_SERVER_IP_2|22|-|
oc3|root|YOUR_SERVER_IP_3|22|-|
oc4|root|YOUR_SERVER_IP_4|22|-|
